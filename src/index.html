<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jholman Diaz</title>
  <link rel="stylesheet" href="style.css">

  <link rel="icon"
    href="https://raw.githubusercontent.com/tejasmali07/Linktree-Page-HTML-CSS-/313e6801ff1c39527a23da5b47f7d61c32261227/Images/tejas.png"
    type="image/x-icon">
</head>

<style>
  * {
    -webkit-tap-highlight-color: rgba(255, 255, 255, 0) !important;
    -webkit-focus-ring-color: rgba(255, 255, 255, 0) !important;
    outline: none !important;
  }
</style>

<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader"></div>
  </div>

  <div class="card">
    <div class="profile reveal">
      <img
        src="https://raw.githubusercontent.com/tejasmali07/Linktree-Page-HTML-CSS-/313e6801ff1c39527a23da5b47f7d61c32261227/Images/tejas.png"
        alt="Profile Image" class="profile-image">
      <h1 class="header-name">Jholman Diaz</h1>
    </div>

    <div class="contact-info reveal">
      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/in/jholman-diaz-09a2a1391?lipi=urn%3Ali%3Apage%3Ad_flagship3_profile_view_base_contact_details%3BZFtLVNwMSzKGkpVnJvX%2FWg%3D%3D" class="contact-link" target="_blank">
        <div class="contact-item">
          <img class="icon" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/linkedin/linkedin-original.svg"
            alt="LinkedIn">
          <span>LinkedIn</span>
        </div>
      </a>

      <!-- GitHub -->
      <a href="https://github.com/camilo20262" class="contact-link" target="_blank">
        <div class="contact-item">
          <img class="icon" src="https://cdn-icons-png.flaticon.com/512/733/733553.png" alt="GitHub">
          <span>Esto es una prueba</span>
        </div>
      </a>


      <!-- CV -->
      <a href="tu-cv.pdf" class="contact-link" target="_blank">
        <div class="contact-item">
          <img class="icon" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="CV">
          <span>CV</span>
        </div>
      </a>

      <!-- Gmail -->
      <a href="mailto:camilo20263@gmail.com" class="contact-link">
        <div class="contact-item">
          <img class="icon" src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Gmail">
          <span>Gmail</span>
        </div>
      </a>
    </div>
  </div>

  <script>
    window.addEventListener('load', function () {
      const loadingScreen = document.getElementById('loading-screen');
      setTimeout(function () {
        loadingScreen.style.display = 'none';
      },);
    });

    document.addEventListener('DOMContentLoaded', function () {
      const elements = document.querySelectorAll('.reveal');

      const revealOnScroll = function () {
        for (let i = 0; i < elements.length; i++) {
          let windowHeight = window.innerHeight;
          let elementTop = elements[i].getBoundingClientRect().top;
          let elementVisible = 150;

          if (elementTop < windowHeight - elementVisible) {
            elements[i].classList.add('reveal-active');
          } else {
            elements[i].classList.remove('reveal-active');
          }
        }
      };

      window.addEventListener('scroll', revealOnScroll);
      revealOnScroll();
    });
  </script>
</body>

</html>
